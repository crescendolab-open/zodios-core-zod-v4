# publish on npm when there is a new version tag

name: publish
on:
  push:
    tags: [v*]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          registry-url: "https://registry.npmjs.org"
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: install dependencies
        run: pnpm install
      - name: build
        run: pnpm build
      - name: run test
        run: pnpm test
      - name: publish to npm
        # only run when tag has no 'rc' in it
        if: ${{ !contains(github.ref, 'rc') }}
        run: npm publish --access public
      - name: publish beta to npm
        # only run when tag has 'rc' in it
        if: ${{ contains(github.ref, 'rc') }}
        run: npm publish --access public --tag beta
      - name: create release
        # git-cliff-action@v2 and actions/create-release@v1 no longer run;
        # use GitHub-generated release notes instead.
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Release $GITHUB_REF_NAME" ${{ contains(github.ref, 'rc') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
